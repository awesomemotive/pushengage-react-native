pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'pushengagereactnative.example'

include ':app'

// PushEngage Android SDK resolves from the published JitPack artifact
// (com.github.awesomemotive:pushengage-android-sdk:0.1.0, declared in
// android/build.gradle).
